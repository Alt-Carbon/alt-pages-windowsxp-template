<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<link rel="stylesheet" href="/admin/editor.css">
</head>
<body>
<div id="app"></div>
<script type="module">
  // The site's editor (alt-pages-editor): forms from /admin/config.yml, sign-in through this
  // site's own Worker (/auth), saving to the site's GitHub repository. editor.js and editor.css
  // are its build (npm run bundle there), copied here.
  import { start } from "/admin/editor.js";
  // A demo site (built with DEMO_EDITOR=1) opens the editor on its own sample content, so anyone can
  // try it and nothing is saved anywhere. Real sites have no demo.js.
  let demoFiles = null;
  try { demoFiles = (await import("/admin/demo.js")).default; } catch { /* a real site */ }
  start(document.getElementById("app"), demoFiles ? { demoFiles } : {});
</script>
</body>
</html>
