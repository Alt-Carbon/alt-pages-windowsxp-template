# Once a week, bring this site up to date with the template it was made from, on GitHub's own
# machines: nothing run by the company is involved. scripts/update-from-template.mjs copies the
# template's files over the site's, leaving content/, public/media/ and .github/ alone; then the
# site is built and tested, and only if both pass is the update committed to main, which
# redeploys the site. If nothing changed, nothing happens. If the build or tests fail, nothing is
# pushed and this run shows as failed. Turn it off in the editor: Site settings → Advanced →
# "Get improvements automatically".
name: Update from the template

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-from-template
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy in the template's changes
        id: update
        run: node scripts/update-from-template.mjs

      - name: Install
        if: steps.update.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.update.outputs.changed == 'true'
        run: npm run build

      - name: Test
        if: steps.update.outputs.changed == 'true'
        run: npm test

      # Only what the script staged is committed; files the build writes stay out.
      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          SHA: ${{ steps.update.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Update from the template ($SHA)"
          # The owner may have published from the editor meanwhile; that only touches content/ and
          # public/media/, which the update never does, so this rebase is clean.
          git pull --quiet --rebase origin main
          git push origin HEAD:main
